<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Redes de computadoras | Exposición</title>
</head>
<body>
    <section id="principal">
        <header id="encabezado">
            <div id="logo">
                <a href="index.html"><img src="img/logo.png" alt="Logo de la página"></a>
            </div>
            <div id="titulo">
                <h4>Bienvenido a la clase de redes V semestre</h4>
            </div>
            <div id="barra">
                <ul>
                    <li><a href="html/queEsRedes.html" onclick="cambiarPagina('html/queEsRedes.html'); return false;">Inicio</a></li>
                    <li><a href="html/tutoria.html" onclick="cambiarPagina('html/tutoria.html'); return false;">Tutorías</a></li>
                    <li><a href="html/contactos.html" onclick="cambiarPagina('html/contactos.html'); return false;">Contacto</a></li>
                </ul>
            </div>
        </header>
        <br>
        
        <iframe id="pantalla" src="html/queEsRedes.html" title="Introducción a las redes de computadoras"></iframe>
            <script>
                const mainFrame = document.getElementById('pantalla');

                window.addEventListener('message', (event) => {
                    if (event.source !== mainFrame.contentWindow || event.data?.type !== 'tutoria-height') {
                        return;
                    }

                    const height = Number(event.data.height);
                    if (Number.isFinite(height)) {
                        mainFrame.style.height = `${Math.max(520, Math.ceil(height))}px`;
                    }
                });

                function cambiarPagina(url) {
                    mainFrame.style.height = '';
                    mainFrame.src = url;
                }
            </script>
    </section>
    <br>
    <footer>
        <p>Derechos reservados &copy; 2024</p>
    </footer>
</body>
</html>
