<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styleInicio.css">
    <script src="../frameHeight.js" data-frame-type="class" defer></script>
    <title>Clase 4 | Redes</title>
    <style>
        /* 1. Elimina la barra de scroll interna que le roba ancho al grid y causa el bucle */
        html, body {
            overflow-x: hidden !important;
            overflow-y: hidden !important;
            width: 100%;
            margin: 0;
        }

        /* 2. Estabiliza la cuadrícula para que no salte entre 2 y 3 columnas */
        .exercise-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
            gap: 16px;
            width: 100%;
        }

        /* 3. Fija el espacio de cada miniatura para que no cambie la altura de golpe */
        .exercise-image img {
            width: 100%;
            height: 160px !important;
            object-fit: contain;
            background-color: #f8fafc;
            display: block;
        }

        .class-pdf {
            width: 100%;
            height: 500px !important;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
    <main class="class-page">
        <header class="class-heading">
            <p class="eyebrow">TUTORIA 04</p>
            <h1>Enrutamiento estático y dinámicoTarea</h1>
            <p class="class-subtitle">Registro fotográfico de los ejercicios de topología, direccionamiento y conectividad.</p>
        </header>
        <section class="exercise-list" id="exercise-list" aria-label="Ejercicios realizados en la clase 2"></section>
        
        <section class="class-material">
            <h2>Práctica de Laboratorio: Enrutamiento estático y dinámico</h2>
            <details class="class-resource">
                <summary>Taller Tutoría 4 (PDF)</summary>
                <div class="class-resource-content">
                    <iframe class="class-pdf" src="../../pdf/TallerTutoria4.pdf" title="Taller de Tutoría 4"></iframe>
                </div>
            </details>
        </section>
        
        <section class="class-material">
        <h2>Material de trabajo</h2>
        <details class="class-resource">
            <summary>Presentación (PDF)</summary>
            <div class="class-resource-content">
                <iframe class="class-pdf" src="../../pdf/tutoria4/presentacion.pdf" title="Presentación de la tutoria 1"></iframe>
            </div>
        </details>
    </section>

    </main>

    <dialog class="image-dialog" id="photo-dialog" aria-labelledby="photo-caption">
        <div class="image-dialog-heading">
            <p id="photo-caption"></p>
            <button class="image-dialog-close" type="button" aria-label="Cerrar imagen ampliada">Cerrar</button>
        </div>
        <img src="" alt="">
    </dialog>
    
    <script>
        const exercises = [
            {
                number: 1,
                focus: 'Topología · Direccionamiento IP · Configuración de enrutamiento',
                summary: 'Diseño de la topología, asignación de direcciones IP y comprobación de conectividad.',
                photos: [
                    { file: '1Tutoria4Eje1DireccionesRedes.png', caption: 'Direcciones de red de los dispositivos' },
                    { file: '2Tutoria4Eje1DireccionesRouters.png', caption: 'Direcciones de red de los Routers' },
                    { file: '3Tutoria4Eje1ConfiguracionRouter4.png', caption: 'Configuración del router 4' },
                    { file: '4Tutoria4Eje1ConfiguracionRouter5.png', caption: 'Configuración del router 5' },
                    { file: '5Tutoria4Eje1DirecionesEstaticasRouter4y5.png', caption: 'Direccionamiento IP estático Routers 4 y 5' },
                    { file: '6Tutoria4Eje1ConfigRouter5.png', caption: 'Añadir redes al router 5' },
                    { file: '7Tutoria4Eje1Topologia.png', caption: 'Topología de red' }
                ]
            },
            {
                number: 2,
                focus: 'Topología · Direccionamiento IP · Configuración de enrutamiento',
                summary: 'Registro del montaje de red, la configuración IP y la verificación entre dispositivos.',
                photos: [
                    { file: '1Tutoria4Eje2ConfigRIPRouter4Interface.png', caption: 'Configuración de RIP en el router 4 desde la Interface' },
                    { file: '2Tutoria4Eje2ConfigRIPRouter5Consola.png', caption: 'Configuración de RIP en el router 5 desde la Consola' },
                    { file: '3Tutoria4Eje2TopologiaSimulacion.png', caption: 'Prueba de conectividad mediante simulación' }
                ]
            }
        ];

        const exerciseList = document.getElementById('exercise-list');
        const photoDialog = document.getElementById('photo-dialog');
        const previewImage = photoDialog.querySelector('img');
        const previewCaption = document.getElementById('photo-caption');

        function createTextElement(tagName, className, text) {
            const element = document.createElement(tagName);
            element.className = className;
            element.textContent = text;
            return element;
        }

        exercises.forEach((exercise) => {
            const section = document.createElement('details');
            section.className = 'exercise-section';
            section.setAttribute('name', 'class4-exercises');

            const heading = document.createElement('summary');
            heading.className = 'exercise-heading';
            heading.append(
                createTextElement('p', 'eyebrow', exercise.focus),
                createTextElement('h2', '', `Ejercicio ${exercise.number}`),
                createTextElement('span', 'exercise-photo-count', `${exercise.photos.length} fotos`)
            );

            const description = createTextElement('p', 'exercise-description', exercise.summary);
            const gallery = document.createElement('div');
            gallery.className = 'exercise-gallery';

            exercise.photos.forEach((photo) => {
                const imagePath = `../../img/Tutoria4/Ejercicio${exercise.number}/${photo.file}`;
                const button = document.createElement('button');
                button.className = 'exercise-image';
                button.type = 'button';
                button.setAttribute('aria-haspopup', 'dialog');
                button.setAttribute('aria-label', `Ampliar ${photo.caption} del Ejercicio ${exercise.number}`);

                const image = document.createElement('img');
                image.src = imagePath;
                image.alt = `${photo.caption} del Ejercicio ${exercise.number}`;
                image.loading = 'lazy';

                button.append(image, createTextElement('span', '', photo.caption));
                button.addEventListener('click', () => {
                    previewImage.src = imagePath;
                    previewImage.alt = image.alt;
                    previewCaption.textContent = `Ejercicio ${exercise.number} · ${photo.caption}`;
                    photoDialog.showModal();
                });
                gallery.append(button);
            });

            section.append(heading, description, gallery);
            exerciseList.append(section);
        });

        photoDialog.querySelector('.image-dialog-close').addEventListener('click', () => photoDialog.close());
        photoDialog.addEventListener('click', (event) => {
            if (event.target === photoDialog) {
                photoDialog.close();
            }
        });
        photoDialog.addEventListener('close', () => previewImage.removeAttribute('src'));
    </script>
</body>
</html>
